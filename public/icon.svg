<!--
  ClassSync app icon.

  The artwork as supplied, at its own 124-unit grid, sized up to 512 so the
  raster versions in this folder render from it cleanly.

  Flat fills only — no gradient, no blur, no soft shadow — which is what keeps
  it legible at 48px on a cheap screen. The icon it replaced was a
  gradient-and-drop-shadow clipboard that turned to mud at launcher size.

  This is the rounded-plate drawing: the favicon, and the manifest's `any`
  purpose. icon-maskable.svg carries the same artwork on a plate that reaches
  the edge, for launchers that crop to their own shape.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 124 124" fill="none" role="img" aria-label="ClassSync">
  <rect width="124" height="124" rx="24" fill="#F97316"/>
  <path d="M19.375 36.7818V100.625C19.375 102.834 21.1659 104.625 23.375 104.625H87.2181C90.7818 104.625 92.5664 100.316 90.0466 97.7966L26.2034 33.9534C23.6836 31.4336 19.375 33.2182 19.375 36.7818Z" fill="white"/>
  <circle cx="63.2109" cy="37.5391" r="18.1641" fill="black"/>
  <rect opacity="0.4" x="81.1328" y="80.7198" width="17.5687" height="17.3876" rx="4" transform="rotate(-45 81.1328 80.7198)" fill="#FDBA74"/>
</svg>
