<!--
  The maskable variant of icon.svg: the same artwork, prepared for a launcher
  that crops the icon to its own shape.

  Two differences, both forced by that crop. The plate reaches the edge, since
  a rounded one would lose its corners and show as a square with four bites
  taken out of it. And the artwork is scaled about the centre to 0.8, because
  a launcher only guarantees the centred circle of 80% diameter and the
  triangle's bottom-left corner sat 60 units out on a 124 grid — some 10 units
  past the safe radius of 49.6. At 0.8 the furthest point lands at 48.2.

  That same circle is small enough to survive iOS's squircle, so
  apple-touch-icon.png renders from this file rather than from the plate.

  e2e/pwa.spec.ts samples the rendered pixels outside the safe circle and
  fails if any of them is something other than the plate.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 124 124" fill="none" role="img" aria-label="ClassSync">
  <rect width="124" height="124" fill="#F97316"/>
  <g transform="translate(62 62) scale(0.8) translate(-62 -62)">
    <path d="M19.375 36.7818V100.625C19.375 102.834 21.1659 104.625 23.375 104.625H87.2181C90.7818 104.625 92.5664 100.316 90.0466 97.7966L26.2034 33.9534C23.6836 31.4336 19.375 33.2182 19.375 36.7818Z" fill="white"/>
    <circle cx="63.2109" cy="37.5391" r="18.1641" fill="black"/>
    <rect opacity="0.4" x="81.1328" y="80.7198" width="17.5687" height="17.3876" rx="4" transform="rotate(-45 81.1328 80.7198)" fill="#FDBA74"/>
  </g>
</svg>
