<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Automatically redirect to add a trailing slash if accessed on subdirectory without one
      // This ensures relative assets like manifest.json and sw.js resolve correctly on GitHub Pages
      if (!window.location.pathname.endsWith('/')) {
        const segments = window.location.pathname.split('/');
        const lastSegment = segments[segments.length - 1];
        if (lastSegment && !lastSegment.includes('.')) {
          window.location.replace(window.location.href + '/');
        }
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ClassSync — presensi kelas</title>
    <meta
      name="description"
      content="Pencatatan presensi santri dengan database lokal di ponsel, bisa dipakai tanpa internet, lengkap dengan penyusun laporan mingguan untuk WhatsApp."
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      The browser chrome continues the masthead rather than announcing itself,
      so it takes the page colour and follows the theme. Signal yellow stays
      inside the app, on the one action it belongs to.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2c2c2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClassSync" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
